# Intentionally weak nginx config. Do not copy into production.
server {
    listen 80 default_server;
    server_name vulnerable.lab;
    root /usr/share/nginx/html;
    index index.html;

    # WEAK: leaks the nginx version in the Server header.
    server_tokens on;

    # WEAK: no security headers added anywhere (CSP, X-Frame-Options, HSTS...).

    # WEAK: directory listing enabled under /files/.
    location /files/ {
        autoindex on;
    }

    # WEAK: dotfiles are served instead of denied, so /.git/ and /.env leak.
    # (A safe config would be:  location ~ /\.  { deny all; } )
    location / {
        try_files $uri $uri/ =404;
    }
}
