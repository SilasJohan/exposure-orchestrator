secure.lab:       { addr: 127.0.0.1, port: 8443, scheme: https }
weak.lab:         { addr: 127.0.0.1, port: 8444, scheme: https }
out-of-scope.lab: { addr: 127.0.0.1, port: 8099, scheme: http }
